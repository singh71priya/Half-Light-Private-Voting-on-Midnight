name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  contract-compile:
    name: Compile Compact contract
    runs-on: ubuntu-latest
    continue-on-error: true # toolchain releases move fast; never block the app pipeline on this
    steps:
      - uses: actions/checkout@v4

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: compact update
        run: compact update

      - name: Compile private-voting.compact
        run: compact compile contract/src/private-voting.compact contract/managed/private-voting

      - name: Upload compiled contract artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contract
          path: contract/managed/private-voting

  frontend:
    name: Lint, test & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Run test suite
        run: npm run test:ci --workspace frontend

      - name: Build production bundle
        run: npm run build --workspace frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
